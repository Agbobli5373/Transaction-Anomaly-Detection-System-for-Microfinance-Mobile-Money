name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The integration tests start Postgres with Testcontainers on the runner's Docker; under CI
      # they fail rather than skip if Docker is missing.
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  # The compose stack starts: Postgres, the migration job, then an API that reports ready.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Throwaway credentials for this run only, in the .env compose reads; none is committed.
      - run: |
          generated=$(openssl rand -hex 16)
          grep -v -E '^(POSTGRES_|PG)PASSWORD=' .env.example > .env
          for key in POSTGRES_PASSWORD PGPASSWORD; do echo "$key=$generated" >> .env; done
      - run: docker compose up --build --detach --wait api
      - run: curl --fail --silent http://127.0.0.1:8000/v1/ready
      - run: curl --fail --silent http://127.0.0.1:8000/v1/openapi.json > /dev/null
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  # A backup taken from the compose Postgres restores into a fresh database, and the restore
  # matches its source: row counts per table and the latest migration (`--compare-with`).
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          generated=$(openssl rand -hex 16)
          grep -v -E '^(POSTGRES_|PG)PASSWORD=' .env.example > .env
          for key in POSTGRES_PASSWORD PGPASSWORD; do echo "$key=$generated" >> .env; done
      - run: docker compose build migrate
      - run: docker compose up --detach --wait postgres
      - run: docker compose run --rm migrate
      - run: docker compose run --rm backup
      - run: docker compose exec -T postgres createdb --username txrisk restored
      - run: >
          docker compose run --rm backup txrisk restore /backups
          --database-url postgresql://txrisk@postgres:5432/restored
          --compare-with postgresql://txrisk@postgres:5432/txrisk
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
