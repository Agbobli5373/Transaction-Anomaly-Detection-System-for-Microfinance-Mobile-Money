name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The integration tests start Postgres with Testcontainers on the runner's Docker; under CI
      # they fail rather than skip if Docker is missing.
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The backup tests run the host's pg_dump and pg_restore against the Postgres 17 container,
      # and the client's major version must match the server's (the runner ships 16).
      - run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  # The compose stack starts: Postgres, Keycloak, Redpanda, the migration job, an API that
  # reports ready and accepts a demo user's token and an API key, and a scoring worker that
  # creates the event topics.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Throwaway credentials for this run only, in the .env compose reads; none is committed.
      - run: |
          generated=$(openssl rand -hex 16)
          grep -v -E '^(POSTGRES_|PG|TXRISK_APP_DB_)PASSWORD=' .env.example > .env
          for key in POSTGRES_PASSWORD PGPASSWORD; do echo "$key=$generated" >> .env; done
          # The application role gets its own value, not the owner's.
          for key in TXRISK_APP_DB_PASSWORD; do echo "$key=$(openssl rand -hex 16)" >> .env; done
          for key in TXRISK_DEMO_SIGNIN_ANALYST TXRISK_DEMO_SIGNIN_SUPERVISOR TXRISK_DEMO_SIGNIN_ADMIN; do
            echo "$key=$(openssl rand -hex 16)"
          done > keycloak.env
      - run: docker compose up --build --detach --wait api worker keycloak
      - run: curl --fail --silent http://127.0.0.1:8000/v1/ready
      - run: curl --fail --silent http://127.0.0.1:8000/v1/openapi.json > /dev/null
      # /v1 refuses a caller without a credential, and accepts the demo Analyst signed in through
      # Keycloak and a service with an API key issued by the operator command.
      - run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/v1/alerts)" = 401
      # The API container never sees the demo sign-in values, so this one-off container gets
      # the Analyst's from the runner's shell.
      - run: |
          set -a; . ./keycloak.env; set +a
          bearer=$(docker compose run --rm --no-deps -e TXRISK_DEMO_SIGNIN_ANALYST api txrisk demo-sign-in analyst --realm-url http://keycloak:8080/realms/txrisk)
          curl --fail --silent --header "Authorization: Bearer $bearer" http://127.0.0.1:8000/v1/alerts
      - run: |
          issued=$(docker compose exec -T api txrisk api-key --name ci-smoke --scope models:read)
          curl --fail --silent --header "X-API-Key: $issued" http://127.0.0.1:8000/v1/models/active
      # The API runs as the least-privilege txrisk_app role: the Alerts call above is on the audit
      # log, which that role can read and append to but never update, delete or truncate.
      - run: |
          docker compose exec -T api python - <<'EOF'
          import os
          import sqlalchemy as sa
          from txrisk.store import create_app_engine

          engine = create_app_engine(os.environ["TXRISK_DATABASE_URL"])
          with engine.connect() as c:
              assert c.execute(sa.text("select current_user")).scalar_one() == "txrisk_app"
              listed = "select count(*) from audit_log where action = 'alert.list'"
              assert c.execute(sa.text(listed)).scalar_one() >= 1
          for change in ("update audit_log set action = action", "delete from audit_log", "truncate audit_log"):
              try:
                  with engine.begin() as c:
                      c.execute(sa.text(change))
              except sa.exc.ProgrammingError:
                  continue
              raise SystemExit("the application role changed the audit log: " + change)
          EOF
      # The worker is consuming once its topics exist and it has joined its consumer group.
      - run: |
          for _ in $(seq 30); do
            if docker compose exec -T redpanda rpk group describe txrisk-scoring 2>/dev/null \
                | grep -q 'transaction.created'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  # A backup taken from the compose Postgres restores into a fresh database, and the restore
  # matches its source: row counts per table and the latest migration (`--compare-with`).
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          generated=$(openssl rand -hex 16)
          grep -v -E '^(POSTGRES_|PG)PASSWORD=' .env.example > .env
          for key in POSTGRES_PASSWORD PGPASSWORD; do echo "$key=$generated" >> .env; done
      - run: docker compose build migrate
      - run: docker compose up --detach --wait postgres
      - run: docker compose run --rm migrate
      - run: docker compose run --rm backup
      - run: docker compose exec -T postgres createdb --username txrisk restored
      - run: >
          docker compose run --rm backup txrisk restore /backups
          --database-url postgresql://txrisk@postgres:5432/restored
          --compare-with postgresql://txrisk@postgres:5432/txrisk
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
