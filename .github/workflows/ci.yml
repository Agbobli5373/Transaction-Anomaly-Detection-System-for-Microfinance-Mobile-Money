name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR supersedes the running checks; main always runs to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Pinned tools that run as containers.
  # LightGBM's OpenMP threads spin against each other on shared runners and dev machines.
  OMP_WAIT_POLICY: PASSIVE
  OMP_NUM_THREADS: "2"
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  OASDIFF_IMAGE: tufin/oasdiff:v1.34.1

jobs:
  # Lint, strict types and the whole test suite except the smoke test, which has its own job.
  # Coverage is gated at 80% on the core logic only; `[tool.coverage.report]` in pyproject.toml
  # says what counts as core.
  check:
    runs-on: ubuntu-latest
    env:
      # The integration tests start Postgres with Testcontainers on the runner's Docker; under CI
      # they fail rather than skip if Docker is missing.
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The backup tests run the host's pg_dump and pg_restore against the Postgres 17 container,
      # and the client's major version must match the server's (the runner ships 16).
      - run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not smoke" --cov --cov-report=term-missing

  # generate -> features -> train -> evaluate on a tiny market, through the CLI.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m smoke

  # Known vulnerabilities in the locked dependencies, runtime and dev. pip-audit has no severity
  # filter, so any known vulnerability with a published advisory fails the build.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv export --locked --no-emit-project --no-hashes --output-file requirements.audit.txt
      - run: uv run pip-audit --requirement requirements.audit.txt --no-deps --disable-pip

  # Trivy: the built image's OS packages and libraries, and the repo's Dockerfile and compose
  # file for misconfigurations. High and critical findings fail the build. The image scan
  # ignores findings with no fixed version (Debian's util-linux, ncurses, systemd, acl and perl
  # CVEs are unpatched today, and nothing in the image can be rebuilt to fix them); the build
  # fails as soon as a fix exists. The Dockerfile and compose scan has no such exception.
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: txrisk:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Scan the image
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ~/.cache/trivy:/root/.cache/trivy \
            "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 txrisk:ci
      - name: Scan the Dockerfile and compose file
        run: |
          docker run --rm \
            -v "$PWD:/src" -v ~/.cache/trivy:/root/.cache/trivy \
            "$TRIVY_IMAGE" config --severity HIGH,CRITICAL --exit-code 1 /src

  # A breaking change to the OpenAPI spec or to an event schema fails the build. The spec the
  # code serves is compared with the one on the commit this change builds on, so a breaking
  # change cannot be hidden by regenerating the snapshot; a test keeps the snapshot current.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Compare with the base commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no base commit to compare with"
            exit 0
          fi
          git worktree add ../base "$BASE"
          uv run python -m txrisk.contract_check openapi > openapi.current.json
          if [ -f ../base/contracts/openapi.json ]; then
            docker run --rm -v "$PWD:/w" -v "$PWD/../base:/base" -w /w "$OASDIFF_IMAGE" \
              breaking /base/contracts/openapi.json openapi.current.json --fail-on ERR
          else
            echo "the base commit has no OpenAPI snapshot yet"
          fi
          # Event schemas are every schemas/*.json; there is nothing to compare until they exist.
          uv run python -m txrisk.contract_check schemas ../base/schemas schemas

  # The compose stack starts: Postgres, Keycloak, Redpanda, the migration job, an API that
  # reports ready and accepts a demo user's token and an API key, and a scoring worker that
  # creates the event topics. Prometheus scrapes the API and the worker, Grafana loads its
  # provisioned datasources and the Operations dashboard, and Jaeger receives the API's traces.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Throwaway credentials for this run only, in the .env compose reads; none is committed.
      - run: |
          generated=$(openssl rand -hex 16)
          grep -v -E '^((POSTGRES_|PG)PASSWORD|GF_SECURITY_ADMIN_PASSWORD|TXRISK_TRACING_ENABLED)=' .env.example > .env
          for key in POSTGRES_PASSWORD PGPASSWORD GF_SECURITY_ADMIN_PASSWORD; do
            echo "$key=$generated" >> .env
          done
          echo "TXRISK_TRACING_ENABLED=true" >> .env
          for key in TXRISK_DEMO_SIGNIN_ANALYST TXRISK_DEMO_SIGNIN_SUPERVISOR TXRISK_DEMO_SIGNIN_ADMIN; do
            echo "$key=$(openssl rand -hex 16)"
          done > keycloak.env
      - run: docker compose up --build --detach --wait api worker keycloak prometheus grafana jaeger
      - run: curl --fail --silent http://127.0.0.1:8000/v1/ready
      - run: curl --fail --silent http://127.0.0.1:8000/v1/openapi.json > /dev/null
      # /v1 refuses a caller without a credential, and accepts the demo Analyst signed in through
      # Keycloak and a service with an API key issued by the operator command.
      - run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/v1/alerts)" = 401
      # The API container never sees the demo sign-in values, so this one-off container gets
      # the Analyst's from the runner's shell.
      - run: |
          set -a; . ./keycloak.env; set +a
          bearer=$(docker compose run --rm --no-deps -e TXRISK_DEMO_SIGNIN_ANALYST api txrisk demo-sign-in analyst --realm-url http://keycloak:8080/realms/txrisk)
          curl --fail --silent --header "Authorization: Bearer $bearer" http://127.0.0.1:8000/v1/alerts
      - run: |
          issued=$(docker compose exec -T api txrisk api-key --name ci-smoke --scope models:read)
          curl --fail --silent --header "X-API-Key: $issued" http://127.0.0.1:8000/v1/models/active
      # The worker is consuming once its topics exist and it has joined its consumer group.
      - run: |
          for _ in $(seq 30); do
            if docker compose exec -T redpanda rpk group describe txrisk-scoring 2>/dev/null \
                | grep -q 'transaction.created'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      # /metrics is not part of the API: it is on a port of its own that compose does not publish.
      - run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/metrics)" = 404
      # Prometheus scrapes the API and the worker (both targets up).
      - run: |
          for _ in $(seq 30); do
            up=$(curl --silent http://127.0.0.1:9090/api/v1/targets \
              | python3 -c 'import json,sys; t = json.load(sys.stdin)["data"]["activeTargets"]; print(*sorted(x["labels"]["job"] for x in t if x["health"] == "up"))')
            case " $up " in *" api "*" worker "*) exit 0 ;; esac
            sleep 2
          done
          echo "targets up: $up"
          exit 1
      # Grafana has the provisioned datasources, healthy, and the Operations dashboard.
      - run: |
          # The throwaway value is the same for every password key in .env (PGPASSWORD).
          . ./.env
          grafana() { curl --fail --silent --user "admin:$PGPASSWORD" "http://127.0.0.1:3001/api/$1"; }
          grafana dashboards/uid/txrisk-operations | grep -q '"title":"Operations"'
          for uid in prometheus jaeger; do
            grafana "datasources/uid/$uid/health" | grep -q '"status":"OK"'
          done
      # Tracing is on in this run: the API's requests reach Jaeger.
      - run: |
          for _ in $(seq 30); do
            curl --fail --silent http://127.0.0.1:8000/v1/health > /dev/null
            if curl --fail --silent http://127.0.0.1:16686/api/services | grep -q txrisk-api; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  # A backup taken from the compose Postgres restores into a fresh database, and the restore
  # matches its source: row counts per table and the latest migration (`--compare-with`).
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          generated=$(openssl rand -hex 16)
          grep -v -E '^(POSTGRES_|PG)PASSWORD=' .env.example > .env
          for key in POSTGRES_PASSWORD PGPASSWORD; do echo "$key=$generated" >> .env; done
      - run: docker compose build migrate
      - run: docker compose up --detach --wait postgres
      - run: docker compose run --rm migrate
      - run: docker compose run --rm backup
      - run: docker compose exec -T postgres createdb --username txrisk restored
      - run: >
          docker compose run --rm backup txrisk restore /backups
          --database-url postgresql://txrisk@postgres:5432/restored
          --compare-with postgresql://txrisk@postgres:5432/txrisk
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  # On main, once everything passes: push the image to GHCR, tagged with the commit SHA.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, smoke, audit, trivy, contracts, compose, restore]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR names are lower case; the repository's owner and name may not be.
      - id: image
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=image
