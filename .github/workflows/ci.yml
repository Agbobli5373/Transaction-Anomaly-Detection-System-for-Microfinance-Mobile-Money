name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The integration tests start Postgres with Testcontainers on the runner's Docker; under CI
      # they fail rather than skip if Docker is missing.
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  # The compose stack starts: Postgres, Redpanda, the migration job, an API that reports ready,
  # and a scoring worker that creates the event topics.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Throwaway credentials for this run only, in the .env compose reads; none is committed.
      - run: |
          generated=$(openssl rand -hex 16)
          grep -v -E '^(POSTGRES_|PG)PASSWORD=' .env.example > .env
          for key in POSTGRES_PASSWORD PGPASSWORD; do echo "$key=$generated" >> .env; done
      - run: docker compose up --build --detach --wait api worker
      - run: curl --fail --silent http://127.0.0.1:8000/v1/ready
      - run: curl --fail --silent http://127.0.0.1:8000/v1/openapi.json > /dev/null
      # The worker is consuming once its topics exist and it has joined its consumer group.
      - run: |
          for _ in $(seq 30); do
            if docker compose exec -T redpanda rpk group describe txrisk-scoring 2>/dev/null \
                | grep -q 'transaction.created'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
