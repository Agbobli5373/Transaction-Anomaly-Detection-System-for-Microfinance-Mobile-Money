# How models are trained and judged over the 120-day period.

# An unlabelled Transaction counts as legitimate only once it is this old (ADR 0007).
label_maturity_days = 30
# Alerts reviewers can handle per day; precision is also reported at this volume.
alert_budget_per_day = 100
# On a festive day the whole market spends more, every amount-driven score rises with it, and a
# fixed High threshold raises twice the Alerts the budget allows, on the days Analysts are busiest
# (#47). High therefore rises with the market spend index (config/features.toml): at index 1.2 it
# is set as if the budget were 1.2 ** surge_elasticity times smaller, never by more than
# surge_max_divisor. 0 keeps High fixed. See ADR 0011.
surge_elasticity = 1.5
surge_max_divisor = 3.0
# Wallet age bands for segment metrics, in days: under 30, 30-180, over 180.
wallet_age_band_edges = [30, 180]

# Days count from the period start (day 0 is its first day); each split includes its first day
# and excludes its last. The first Champion model goes live on day 90, when only Transactions
# before day 60 are old enough to have mature labels, so everything that needs labels is fitted
# on days 0-60. Thresholds need only scores, so they use the most recent days (ADR 0008).
[splits]
train = [0, 45]
calibration = [45, 60]
thresholds = [60, 90]
evaluation = [90, 120]
