# Synthetic Ghana-style mobile money market used by the generator.
# Limits and amounts are illustrative of a tiered e-money market, not a copy of any regulation.

[period]
start = "2026-01-01"
days = 120

[population]
wallets = 10000
agents = 300
merchants = 200
# Share of Wallets already registered before the period starts; the rest register during it.
preexisting_wallet_share = 0.7
# Wallet holders usually transact with a small circle of other Wallets.
contacts_per_wallet = 8

[market]
currency = "GHS"
# Ghana mobile network prefixes after the 233 country code.
msisdn_prefixes = ["20", "23", "24", "25", "26", "27", "28", "50", "53", "54", "55", "56", "57", "59"]
merchant_categories = ["grocery", "fuel", "pharmacy", "restaurant", "transport", "retail", "education"]
biller_categories = ["electricity", "water", "pay_tv", "airtime", "internet", "school_fees"]

# Region name = relative population weight (2021 census, millions).
[market.regions]
"Greater Accra" = 5.46
"Ashanti" = 5.44
"Eastern" = 2.93
"Central" = 2.86
"Northern" = 2.31
"Western" = 2.06
"Volta" = 1.66
"Upper East" = 1.30
"Bono" = 1.21
"Bono East" = 1.20
"Upper West" = 0.90
"Western North" = 0.88
"Oti" = 0.75
"North East" = 0.66
"Savannah" = 0.65
"Ahafo" = 0.56

[[market.kyc_tiers]]
name = "minimum"
share = 0.45
single_transaction_limit = 1000
max_balance = 2000

[[market.kyc_tiers]]
name = "medium"
share = 0.40
single_transaction_limit = 5000
max_balance = 15000

[[market.kyc_tiers]]
name = "enhanced"
share = 0.15
single_transaction_limit = 15000
max_balance = 50000

[behaviour]
mean_transactions_per_day = 2.0
# Median balance (GHS) of Wallets that already exist when the period starts; new Wallets start empty.
median_opening_balance = 150
weekend_activity_factor = 0.85
usd_channel_share = 0.7
home_region_share = 0.92
# Relative activity per hour of day, 00:00 to 23:00 local time (UTC+0).
hourly_activity = [
    0.15, 0.08, 0.05, 0.05, 0.10, 0.35,
    0.80, 1.20, 1.40, 1.30, 1.20, 1.20,
    1.30, 1.20, 1.10, 1.10, 1.20, 1.40,
    1.50, 1.40, 1.10, 0.80, 0.50, 0.30,
]

# Per Transaction type: share of activity and the median amount in GHS.
[behaviour.transaction_types.cash_in]
share = 0.22
median_amount = 150

[behaviour.transaction_types.cash_out]
share = 0.18
median_amount = 120

[behaviour.transaction_types.transfer]
share = 0.30
median_amount = 80

[behaviour.transaction_types.payment]
share = 0.18
median_amount = 45

[behaviour.transaction_types.bill_payment]
share = 0.12
median_amount = 30

[fraud]
# Target share of all Transactions that are fraudulent.
rate = 0.002
# Share of Wallets that get a legitimate SIM swap (new SIM, no fraud) during the period.
legitimate_sim_swap_share = 0.02
# Fraudsters target Wallets that usually hold at least this much (GHS).
victim_min_median_balance = 100

# Each scenario: its share of fraudulent Transactions, and [min, max] ranges that every
# instance draws its own parameters from.
[fraud.scenarios.sim_swap_takeover]
share = 0.25
delay_hours = [0.5, 12]
transactions = [1, 3]
drain_share = [0.6, 1.0]

[fraud.scenarios.account_takeover_drain]
share = 0.20
burst_minutes = [10, 60]
transactions = [3, 6]
drain_share = [0.3, 0.7]

[fraud.scenarios.mule_fan_in]
share = 0.25
senders = [10, 25]
window_hours = [6, 24]
sent_amount = [50, 500]
cash_out_delay_hours = [0.5, 6]
cash_outs = [1, 3]

[fraud.scenarios.agent_structuring]
share = 0.15
cash_outs = [5, 12]
window_hours = [4, 24]
limit_share = [0.9, 0.995]

# Introduced by drift (see [fraud.drift]); its share applies only once it is active.
[fraud.scenarios.reversal_scam]
share = 0.15
bait_amount = [20, 100]
reply_minutes = [10, 90]
return_multiple = [3, 10]

[fraud.scenarios.social_engineering_push]
share = 0.15
# Told to "secure" their money, the victim first tops up by a multiple of their usual balance.
top_up_multiple = [2, 5]
top_up_lead_minutes = [10, 120]
drain_share = [0.5, 0.95]

# How fraud comes to light without the system: the victim complains or disputes a charge.
[fraud.discovery]
delay_days = [1, 30]
chargeback_share = 0.3

# Chance that a victim of each scenario ever reports it. Agent structuring has no victim to complain.
[fraud.discovery.probability]
sim_swap_takeover = 0.8
account_takeover_drain = 0.7
mule_fan_in = 0.5
agent_structuring = 0.05
social_engineering_push = 0.6
reversal_scam = 0.6

# From this day of the period, a new scenario appears and an existing one changes shape.
[fraud.drift]
day = 100
new_scenario = "reversal_scam"
shifted_scenario = "sim_swap_takeover"

[fraud.drift.sim_swap_takeover]
delay_hours = [24, 72]
transactions = [3, 6]
drain_share = [0.2, 0.4]

# Unusual but legitimate behaviour. None of it is fraud.
[benign]
# Wallets paid monthly bring the money in as a Cash-in around pay day.
salaried_share = 0.15
pay_day = [25, 28]
pay_amount = [400, 3000]
# One-off large Payments (a phone, school fees), topped up just before.
large_payment_share = 0.05
large_payment_multiple = [5, 20]
# Trips: for a few days a Wallet transacts in another region.
travel_share = 0.08
travel_days = [2, 10]
# A legitimate new phone, used from then on; some move to the App with it.
new_phone_share = 0.04
new_phone_app_share = 0.5

[[benign.festive]]
name = "New Year"
start = "2026-01-01"
end = "2026-01-02"
activity_multiple = 1.6
amount_multiple = 1.4

[[benign.festive]]
name = "Easter"
start = "2026-04-03"
end = "2026-04-06"
activity_multiple = 1.4
amount_multiple = 1.3
