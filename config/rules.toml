# Rules-only scoring: thresholds for each rule and how Rule hits combine into a Risk score.
# Stacking with the models (ticket #11) replaces the weights and bands; the rules stay.

# At most this many Reasons are returned per Risk score.
max_reasons = 3
# Rules-only scoring: a Critical rule hit puts the Risk score at least this high, inside the High
# band. A model bundle floors a Critical rule hit at its own High threshold instead, since its
# Risk score is a probability x 100 on a different scale.
critical_floor = 90

# How much one hit of each severity adds; hits combine as 1 - product(1 - weight).
[severity_weights]
low = 0.10
medium = 0.25
high = 0.50
critical = 0.90

# The Risk score (0-100) at which each band starts; below Medium is Low.
[bands]
medium = 20
high = 50

[rules.SIM_SWAP_DRAIN]
severity = "critical"
within_hours = 24
min_share_of_balance = 0.5

[rules.NEW_DEVICE_BURST]
severity = "high"
device_new_within_minutes = 60
min_new_counterparty_transfers = 3

[rules.MULE_CASHOUT]
severity = "high"
min_distinct_senders_24h = 10

# A second near-limit Cash-out at one Agent within 24 hours is already rare: about 2 a day on the
# threshold days, against 1.2 a day for a fifth. See docs/evaluation/stacked.md, Agent structuring
# and the Reversal scam.
[rules.AGENT_STRUCTURING]
severity = "high"
# Matches near_limit_share in config/features.toml: at least 90% of the KYC tier limit.
min_share_of_limit = 0.90
min_near_limit_cash_outs_24h = 2

# The Cash-in that loads a structured Cash-out: close to the limit, and far above anything the
# Wallet has brought in lately. Like the usual-amount rules below, it waits until the Wallet is 30
# days old. About 1.5 hits a day on the threshold days.
[rules.NEAR_LIMIT_CASH_IN]
severity = "high"
min_share_of_limit = 0.90
above_largest_multiple = 5
min_wallet_age_days = 30

# A Transfer to a first-time recipient who sent this Wallet money in the last 24 hours: the
# "I sent that by mistake, please send it back" of the Reversal scam. It never fired on the train,
# calibration or threshold days. See docs/evaluation/stacked.md, Agent structuring and the
# Reversal scam.
[rules.RETURN_TO_NEW_SENDER]
severity = "high"

# Both rules compare an amount with the Wallet's own usual amount, so neither fires in a Wallet's
# first 30 days. On the training and calibration days, 6 of their 2,716 hits on new Wallets were
# fraud, against 1 in 15 (FIRST_TIME_LARGE_TRANSFER) and 1 in 50 (AMOUNT_VS_MEDIAN) on older
# Wallets. See docs/evaluation/stacked.md, New Wallets.
[rules.FIRST_TIME_LARGE_TRANSFER]
severity = "medium"
above_median_multiple = 3
min_wallet_age_days = 30

[rules.AMOUNT_VS_MEDIAN]
severity = "medium"
above_median_multiple = 5
min_wallet_age_days = 30

[rules.NEAR_KYC_LIMIT]
severity = "low"
min_share_of_limit = 0.95

[rules.NEW_REGION]
severity = "low"

[rules.ODD_HOUR]
severity = "low"
night_ends_at_hour = 5
max_night_share = 0.05
