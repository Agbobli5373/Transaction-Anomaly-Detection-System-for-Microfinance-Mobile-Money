# `txrisk scheduler`: the jobs it fires as the simulation clock (ADR 0005) crosses their schedule,
# once per simulated period. In a replay, "daily" is a day of event time, a few wall-clock minutes.
# Each job runs `command` in a one-off container: a compose service run, or a Kubernetes Job.
timezone = "UTC"

[jobs.retention-purge]
schedule = "daily"
command = ["txrisk", "purge"]

# Re-scores Transactions scored in Degraded mode once the Champion model is healthy; a no-op when
# none are waiting. Exits 3 while the model is still down. It runs as the owner like any job
# (the API and workers re-score too, as `txrisk_app`, which may only replace degraded assessments).
[jobs.rescore-degraded]
schedule = "daily"
command = ["txrisk", "rescore"]

# The model's daily health check for the simulated day just ended (txrisk.monitoring): drift
# against the training baseline, Alert volume, Risk band mix, label-based performance and Fraud
# discovery sources. It stores them in Postgres and pushes them to the Pushgateway, which
# Prometheus scrapes for the Model health dashboard and the Alertmanager rules.
[jobs.model-monitor]
schedule = "daily"
command = ["txrisk", "monitor"]

# Weekly retraining: a new bundle from the Transactions, SIM swaps and Fraud labels Postgres holds at
# the simulated time (config/evaluation.toml's label maturity and split lengths, slid to that time),
# registered as the Challenger model. Workers pick it up and score every Transaction in shadow.
[jobs.retrain-weekly]
schedule = "weekly"
command = ["txrisk", "retrain"]

# Early retraining: runs only if the monitoring job found a drift action alert (a PSI at or above
# the action threshold) since the last retraining run, and the last one was a few days ago
# (config/retraining.toml). Otherwise it exits at once. It sees a day's drift when the clock has
# entered the next day, the same day `model-monitor` computes it, so it acts on the previous
# day's findings.
[jobs.retrain-on-drift]
schedule = "daily"
command = ["txrisk", "retrain", "--if-drift"]

# `--launcher compose`: job containers are `docker compose run` of this service.
[compose]
file = "docker-compose.yml"
service = "job"

# `--launcher kubernetes`: job containers are Jobs in this namespace. `env_from` names a Secret
# holding the environment (database URL, database password), so none is written in a Job.
[kubernetes]
namespace = "default"
image = "txrisk:dev"
