# Metrics, model monitoring and traces. Prometheus scrapes each service's metrics port (found by DNS,
# so every replica of a scaled service is a target) and evaluates the alerting rules in
# deploy/prometheus/rules; they fire into Alertmanager, which routes them to the alert sink.
# Grafana shows the provisioned dashboards. Nothing here is exposed outside the cluster:
# `kubectl port-forward` reaches the UIs.
{{- $prometheus := dict "root" . "component" "prometheus" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    {{- include "txrisk.labels" $prometheus | nindent 4 }}
data:
  prometheus.yml: |
    {{- include "txrisk.prometheusConfig" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  labels:
    {{- include "txrisk.labels" $prometheus | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/prometheus-rules/*.yml" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "txrisk.labels" $prometheus | nindent 4 }}
spec:
  selector:
    {{- include "txrisk.selector" $prometheus | nindent 4 }}
  ports:
    - name: http
      port: 9090
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  labels:
    {{- include "txrisk.labels" $prometheus | nindent 4 }}
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      {{- include "txrisk.selector" $prometheus | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "txrisk.labels" $prometheus | nindent 8 }}
      annotations:
        checksum/config: {{ include "txrisk.prometheusConfig" . | sha256sum }}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: {{ .Values.image.prometheus }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            {{- include "txrisk.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.prometheus.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.prometheus.storage }}
{{- $pushgateway := dict "root" . "component" "pushgateway" }}
---
