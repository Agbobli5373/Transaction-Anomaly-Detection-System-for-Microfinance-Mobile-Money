# Scrapes every txrisk service's metrics port, found by DNS so that `--scale worker=3` is three
# targets. The ports are reachable on the compose network only; nothing is published.
#   api     :9101  (TXRISK_METRICS_PORT, apart from the API's own port: /metrics is not part of
#                   /v1 and needs no credential)
#   worker  :9100
#   replay  :9102  (a one-off job: a target only while `docker compose run --use-aliases replay`
#                   runs; `produce` publishes on the same port)
#   pushgateway :9091  the monitoring job's metrics (`txrisk monitor` is a one-off container, so it
#                   pushes them here and the Pushgateway keeps the latest). honor_labels keeps the
#                   labels the job pushed.
#   alert-sink :9095  the alerts Alertmanager has sent to the webhook sink
# The scheduler runs on the host (`make scheduler`); give it `--metrics-port` and add it here.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

# Alerting rules for model monitoring, and where they fire (Alertmanager, then the webhook sink).
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9101
        refresh_interval: 5s
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
        refresh_interval: 5s
  - job_name: replay
    dns_sd_configs:
      - names: [replay]
        type: A
        port: 9102
        refresh_interval: 5s
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: [pushgateway:9091]
  - job_name: alert-sink
    static_configs:
      - targets: [alert-sink:9095]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
