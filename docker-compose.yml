# The development stack: Postgres, Redis, Keycloak, Redpanda, the migration job, the scoring API and
# the scoring workers. The txrisk services read .env (copy .env.example) and Keycloak reads
# keycloak.env (copy keycloak.env.example); no credential is written here.
#   docker compose up --build             # Postgres, Redis, Keycloak, Redpanda, migrations, the API on :8000, a worker
#   docker compose run --rm seed          # load data/generated as history (after `make generate`)
#   docker compose run --rm produce       # publish the live days of data/generated as events
#   docker compose up --scale worker=3    # more workers share transaction.created's partitions
#   docker compose run --rm replay        # replay the live days (with Fraud discoveries) at a day a minute
#   make scheduler                        # fire the scheduled jobs as the simulation clock advances
#   docker compose run --rm --use-aliases replay   # as above, with its metrics scraped by Prometheus
#   make monitor                          # the daily model monitoring job, by hand (the scheduler fires it per simulated day)
#   Grafana http://localhost:3001 (Operations, Model health and Fraud outcomes dashboards; admin password GF_SECURITY_ADMIN_PASSWORD in
#   .env), Prometheus http://localhost:9090, Alertmanager http://localhost:9093, Jaeger
#   http://localhost:16686 (traces need TXRISK_TRACING_ENABLED=true in .env); all published on this
#   machine only. The Pushgateway and the alert sink are on the compose network alone.
#   Case workbench http://localhost:3000 (sign in through Keycloak; needs AUTH_SECRET in .env)
#   Evaluation pages http://localhost:8501 (needs TXRISK_EVALUATION_API_KEY in .env; README: Evaluation pages)
#   docker compose run --rm seed-cases    # demo Cases for the workbench (README: Workbench)
#   docker compose run --rm backup        # one Postgres backup into the `backups` volume (docs/runbooks/restore.md)
# Set TXRISK_MODEL_BUNDLE=/models/<version> in .env to score with a bundle from `make train`;
# without it the rules alone score.

x-txrisk-environment: &txrisk-environment
  # Tokens name the realm as browsers reach it; the API fetches its signing keys in-network.
  TXRISK_OIDC_ISSUER: http://localhost:8080/realms/txrisk
  TXRISK_OIDC_JWKS_URL: http://keycloak:8080/realms/txrisk/protocol/openid-connect/certs
  # The workbench, and the dev-only command-line sign-in; production allows the workbench alone.
  TXRISK_OIDC_ALLOWED_CLIENTS: txrisk-workbench,txrisk-demo-cli
  TXRISK_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  # The recent-history cache (ADR 0006). Every service that stores Transactions must use it.
  TXRISK_REDIS_URL: redis://redis:6379/0
  # Tracing is off unless .env sets TXRISK_TRACING_ENABLED=true; spans then go to Jaeger.
  TXRISK_TRACING_ENABLED: ${TXRISK_TRACING_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

# The migration job and the one-off jobs (seed, backup) connect as the database owner, which can
# change anything. No credential is in a URL: libpq reads the owner's password from PGPASSWORD in
# .env.
x-txrisk: &txrisk
  build: .
  image: txrisk:dev
  env_file: .env
  environment:
    <<: *txrisk-environment
    TXRISK_DATABASE_URL: postgresql://txrisk@postgres:5432/txrisk

# The API and the workers connect as txrisk_app, a role that can only select from and insert into
# the audit log (src/txrisk/store/roles.py). `txrisk migrate` creates it, with the password in
# .env under TXRISK_APP_DB_PASSWORD, which the application reads itself.
x-txrisk-app: &txrisk-app
  <<: *txrisk
  environment: &txrisk-app-environment
    <<: *txrisk-environment
    TXRISK_DATABASE_URL: postgresql://txrisk_app@postgres:5432/txrisk

services:
  postgres:
    image: postgres:17-alpine
    # The superuser's password comes from .env, like everything secret.
    env_file: .env
    environment:
      POSTGRES_USER: txrisk
      POSTGRES_DB: txrisk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "txrisk", "-d", "txrisk"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The recent-history cache (ADR 0006): reachable as redis:6379 on the compose network only, with
  # no published port, so it takes no password. A cache holds nothing Postgres does not, and
  # nothing is persisted: restarting it just means reads fall back to Postgres until it refills.
  # Anywhere beyond a development machine, run an authenticated Redis and pass its credential
  # through .env, never in a committed URL.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  # Sign-in for people, for development only: the txrisk realm, its roles (analyst, supervisor,
  # admin), clients and demo users, imported from config/keycloak/ at startup. Keycloak reads only
  # keycloak.env (copy keycloak.env.example), never .env: each demo user's sign-in value
  # TXRISK_DEMO_SIGNIN_<ROLE>, substituted into the realm, and optionally its bootstrap admin for
  # the console at http://localhost:8080/admin. deploy/keycloak/start-dev.sh refuses to start
  # unless every demo sign-in value is set. Dev mode keeps no state between runs: each start
  # imports the realm afresh. Published on this machine only.
  keycloak:
    image: keycloak/keycloak:26.4.2
    entrypoint: ["bash", "/opt/txrisk/start-dev.sh"]
    env_file:
      - path: keycloak.env
        required: false
    environment:
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro
      - ./deploy/keycloak/start-dev.sh:/opt/txrisk/start-dev.sh:ro
    healthcheck:
      # The image has no curl; bash asks the management port's readiness endpoint itself.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # The event stream (ADR 0004): one broker, reachable as redpanda:9092 inside compose and as
  # localhost:19092 from the host.
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Applies the schema migrations and provisions the txrisk_app role, then exits. Nothing else
  # changes the schema.
  migrate:
    <<: *txrisk
    command: ["txrisk", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: `docker compose run --rm seed`.
  seed:
    <<: *txrisk
    profiles: ["seed"]
    command: ["txrisk", "seed", "--data", "/data/generated"]
    volumes:
      - ./data:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # One-off: `docker compose run --rm seed-cases --tag demo --count 3 [--medium 20]` makes demo
  # Cases and Medium Transactions through the store, as the database owner, for the workbench.
  seed-cases:
    <<: *txrisk
    profiles: ["demo"]
    entrypoint: ["txrisk", "seed-cases"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-off: `docker compose run --rm produce`, standing in for the ledger. Publishes the
  # Transactions and SIM swaps from the day `seed` stops at, in event-time order.
  produce:
    <<: *txrisk
    profiles: ["produce"]
    command: ["txrisk", "produce", "--data", "/data/generated"]
    environment:
      <<: *txrisk-environment
      TXRISK_METRICS_PORT: "9102"
    volumes:
      - ./data:/data:ro
    depends_on:
      redpanda:
        condition: service_healthy

  # One-off: `docker compose run --rm replay [--seconds-per-day N]`. Publishes the live days,
  # Transactions, SIM swaps and Fraud discoveries alike, in event-time order at a set pace: a
  # simulated day a minute by default, 0 for as fast as possible. Event times are not changed.
  replay:
    <<: *txrisk
    profiles: ["replay"]
    command: ["txrisk", "replay", "--data", "/data/generated"]
    environment:
      <<: *txrisk-environment
      TXRISK_METRICS_PORT: "9102"
    volumes:
      - ./data:/data:ro
    depends_on:
      redpanda:
        condition: service_healthy

  # The container every scheduled job runs in (config/scheduler.toml): the scheduler starts one per
  # job and simulated period with `docker compose run --detach job <command>`. Never started on its own.
  job:
    <<: *txrisk
    profiles: ["job"]
    command: ["txrisk", "--help"]
    environment:
      <<: *txrisk-environment
      TXRISK_DATABASE_URL: postgresql://txrisk@postgres:5432/txrisk
      # `txrisk monitor` pushes its metrics here (see the pushgateway service).
      TXRISK_PUSHGATEWAY_URL: http://pushgateway:9091
      # `txrisk retrain` saves each new bundle in /models, where the workers and the API (which
      # mount it read-only) load the Challenger model from, and tracks its runs in MLflow there.
      TXRISK_MODELS_DIR: /models
      TXRISK_MLFLOW_URI: sqlite:////models/mlflow.db
      TXRISK_MLFLOW_ARTIFACTS: /models/mlruns
    volumes:
      - ./models:/models
      - ./data:/data:ro

  # One-off: `docker compose run --rm backup` writes a timestamped pg_dump into the `backups` volume
  # and prunes it to the retention count in config/backup.toml. A scheduler or host cron calls it.
  backup:
    <<: *txrisk
    profiles: ["backup"]
    command: ["txrisk", "backup", "--out", "/backups"]
    volumes:
      - backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *txrisk-app
    command: ["txrisk", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *txrisk-app-environment
      # Prometheus metrics, on a port of their own that is not published (see deploy/prometheus).
      TXRISK_METRICS_PORT: "9101"
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # Services can score with API keys before Keycloak is up; people's tokens are checked once
      # it is.
      keycloak:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/ready')"
      interval: 5s
      timeout: 5s
      retries: 30

  # The Case workbench (Next.js): people sign in through Keycloak and work Cases through the API.
  # The browser reaches Keycloak as localhost:8080 and the workbench; the Next.js server reaches
  # them as keycloak:8080 and api:8000, and keeps every token to itself. AUTH_SECRET, which
  # encrypts the session cookie, comes from .env (the workbench refuses to start without it).
  # Published on this machine only.
  workbench:
    build: ./workbench
    image: txrisk-workbench:dev
    environment:
      AUTH_SECRET:
      OIDC_ISSUER: http://localhost:8080/realms/txrisk
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/txrisk
      TXRISK_API_URL: http://api:8000
      WORKBENCH_PUBLIC_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/signed-out').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # The evaluation pages (Streamlit) for ML engineers: model versions, their metrics and curves,
  # and a side-by-side comparison. They read the API alone, with one API key holding the
  # models:read scope (`docker compose exec api txrisk api-key --name evaluation-pages --scope
  # models:read`, shown once) that goes in .env as TXRISK_EVALUATION_API_KEY, so the container
  # gets neither the database nor the other settings. Published on this machine only.
  evaluation-pages:
    build:
      context: .
      dockerfile: evaluation-pages/Dockerfile
    image: txrisk-evaluation-pages:dev
    environment:
      TXRISK_API_URL: http://api:8000
      TXRISK_EVALUATION_API_KEY:
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Scores transaction.created into score.produced. A worker that stops for any reason leaves
  # its uncommitted batch to be redelivered, so it is simply restarted.
  worker:
    <<: *txrisk-app
    command: ["txrisk", "worker"]
    restart: unless-stopped
    environment:
      <<: *txrisk-app-environment
      TXRISK_METRICS_PORT: "9100"
    volumes:
      - ./models:/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Publishes the transactional outbox (the Fraud discoveries of Cases closed as fraud) to
  # fraud.discovered. At-least-once: a crash republishes, and the Fraud label store is idempotent.
  outbox:
    <<: *txrisk-app
    command: ["txrisk", "outbox"]
    restart: unless-stopped
    environment:
      <<: *txrisk-app-environment
      TXRISK_METRICS_PORT: "9102"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy

  # Metrics: Prometheus scrapes every service's metrics
  # port over the compose network, and Grafana shows the provisioned Operations dashboard.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - alertmanager
      - pushgateway
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Where the monitoring job's metrics go. `txrisk monitor` is a one-off container that exits in
  # seconds, so Prometheus cannot scrape it; it pushes the latest day's metrics here and Prometheus
  # scrapes the Pushgateway, which keeps them until the next push. (The alternative, an exporter
  # serving the stored values, would be one more service holding database access.) Reachable as
  # pushgateway:9091 on the compose network only: nothing is published.
  pushgateway:
    image: prom/pushgateway:v1.11.1

  # Evaluates nothing itself: Prometheus' rules (deploy/prometheus/rules) fire into it and it
  # routes them to the alert sink. The UI is published on this machine only.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      - alert-sink
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 3s
      timeout: 5s
      retries: 30

  # The webhook Alertmanager sends to: records each alert it receives and exposes them as
  # Prometheus metrics, which the Model health dashboard shows. It stands in for a pager or chat
  # integration. Compose network only (alert-sink:9095); it keeps nothing across restarts.
  alert-sink:
    <<: *txrisk
    env_file: []
    environment: {}
    command: ["txrisk", "alert-sink", "--port", "9095"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9095/healthz')"
      interval: 3s
      timeout: 5s
      retries: 30

  # The admin password is GF_SECURITY_ADMIN_PASSWORD in .env, which Grafana reads natively;
  # deploy/grafana/start.sh refuses to start without it. Datasources and the dashboard are
  # provisioned from deploy/grafana and cannot be edited in the UI. Port 3001: 3000 is the workbench.
  grafana:
    image: grafana/grafana:12.2.0
    entrypoint: ["sh", "/opt/txrisk/start.sh"]
    env_file: .env
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/grafana/start.sh:/opt/txrisk/start.sh:ro
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - jaeger
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Traces: services send OTLP/HTTP to jaeger:4318 when TXRISK_TRACING_ENABLED=true. Spans are
  # kept in memory, so they are gone when it restarts.
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  pgdata:
  redpanda:
  backups:
  prometheus:
  alertmanager:
