[project]
name = "txrisk"
version = "0.1.0"
description = "Transaction risk scoring for mobile money wallets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.0",
    "fastapi>=0.162.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.10",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
txrisk = "txrisk.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pip-audit>=2.10.1",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.15.0",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txrisk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "shap.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "smoke: the generate -> features -> train -> evaluate smoke test; CI runs it as its own job",
]

# Coverage is gated on the core logic only (issue #1): the features, rules and scoring, the
# store's scoring and records, and the evaluation thresholds. The gate is on what the tests of
# behaviour reach there; nothing is omitted to reach it. Run `uv run pytest --cov`.
[tool.coverage.run]
source = ["txrisk"]
branch = true

[tool.coverage.report]
include = [
    "src/txrisk/features/*",
    "src/txrisk/scoring/*",
    "src/txrisk/store/scoring.py",
    "src/txrisk/store/records.py",
    "src/txrisk/evaluation/thresholds.py",
]
fail_under = 80
