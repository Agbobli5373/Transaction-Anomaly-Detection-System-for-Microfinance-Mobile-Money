[project]
name = "txrisk"
version = "0.1.0"
description = "Transaction risk scoring for mobile money wallets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.10",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
txrisk = "txrisk.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txrisk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "shap.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
